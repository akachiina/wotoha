<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wotoha 🪼</title>
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="jelly" src="/static/favicon.svg" alt="">
    <span class="name">wotoha</span>
    <span class="tagline">from the futon to space</span>
  </div>
  <nav>
    <button class="nav-btn" data-view="search">Search</button>
    <button class="nav-btn" data-view="downloads">Downloads</button>
  </nav>
  <button id="theme-toggle" class="theme-toggle" title="Toggle theme">☾</button>
</header>

<main>
  <!-- ============ SEARCH ============ -->
  <section id="view-search" class="view">
    <form id="search-form" class="search-bar">
      <select id="source-select"></select>
      <input id="search-input" type="search" placeholder="Search manga..." autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <div id="search-meta" class="muted"></div>
    <div id="results" class="grid"></div>
    <div class="pager">
      <button id="prev-page">← Prev</button>
      <span id="page-label" class="muted"></span>
      <button id="next-page">Next →</button>
    </div>
  </section>

  <!-- ============ MANGA DETAILS ============ -->
  <section id="view-manga" class="view hidden">
    <button class="back-btn" data-back="search">← Back</button>
    <div class="manga-header">
      <img id="manga-cover" alt="cover">
      <div class="manga-info">
        <h1 id="manga-title"></h1>
        <div id="manga-meta" class="meta-lines"></div>
        <p id="manga-desc" class="description"></p>
        <div class="download-controls">
          <label>Format
            <select id="dl-format">
              <option value="cbz">CBZ</option>
              <option value="epub">EPUB</option>
              <option value="pdf">PDF</option>
              <option value="raw">RAW</option>
              <option value="cb7">CB7</option>
            </select>
          </label>
          <label>Mode
            <select id="dl-mode">
              <option value="chapter">Per chapter</option>
              <option value="volume">Per volume</option>
              <option value="single">Single file</option>
            </select>
          </label>
          <button id="dl-selected" class="primary">Download selected</button>
          <button id="dl-all">Download all</button>
        </div>
      </div>
    </div>
    <h2>Chapters</h2>
    <div id="chapter-list" class="chapters"></div>
  </section>

  <!-- ============ READER ============ -->
  <section id="view-reader" class="view hidden">
    <div class="reader-bar">
      <button class="back-btn" data-back="manga">← Back</button>
      <span id="reader-title"></span>
      <span id="reader-page" class="muted"></span>
    </div>
    <div id="reader-pages"></div>
  </section>

  <!-- ============ DOWNLOADS ============ -->
  <section id="view-downloads" class="view hidden">
    <h1>Downloads</h1>
    <div id="jobs" class="jobs"></div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js"></script>
</body>
</html>
